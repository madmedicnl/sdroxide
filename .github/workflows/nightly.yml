name: Nightly

# A rolling weekly build of `main`.
#
# Rather than duplicate the ~900-line release workflow, this moves a `nightly`
# tag to the branch head and dispatches `release.yml` against it. The release
# job publishes a tag ref as a release, and it knows to mark this one a
# **pre-release** — so `/releases/latest`, and the README's stable download
# links, keep pointing at a real tagged release rather than at last night's
# build.
#
# Scheduled workflows only run on the default branch, and run against whatever
# is pushed there: this builds the remote `main`, not any local checkout.
on:
  schedule:
    # Mondays at 03:00 UTC. Weekly rather than a rolling nightly: the program is
    # near settled, so most nights rebuild an unchanged tree — fourteen platform
    # builds and thirty-odd assets for nothing. The step below skips even that
    # when `main` has not moved. GitHub's scheduler is best-effort — a busy
    # queue can delay it by minutes, and it skips a run if one is already going
    # (see the concurrency group below).
    - cron: '0 3 * * 1'
  # For a build on demand, from the Actions tab or
  # `gh workflow run nightly.yml`. A manual run always builds, whether the
  # branch moved or not.
  workflow_dispatch:

permissions:
  # Move the `nightly` tag.
  contents: write
  # Dispatch the Release workflow.
  actions: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    name: retag and start the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history so the tag can be moved, and the default branch
          # explicitly so a manual run from another ref still tags `main`.
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Point the nightly tag at the branch head
        id: tag
        env:
          EVENT: ${{ github.event_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A scheduled run on a branch that has not moved would rebuild the
          # same tree, which is fourteen platform builds and ~30 assets for
          # nothing. Leave the tag where it is and build nothing. A manual run
          # skips this check, so asking for a build always gets one.
          git fetch --force --tags origin
          if [ "$EVENT" = "schedule" ] &&
             git rev-parse -q --verify refs/tags/nightly > /dev/null &&
             [ "$(git rev-parse 'refs/tags/nightly^{commit}')" = "$(git rev-parse HEAD)" ]; then
            echo "nightly already points at $(git rev-parse --short HEAD) — nothing to build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git tag -f nightly HEAD
          # Force, because the tag moves every week; that is what makes it
          # "nightly" rather than a growing pile of tags.
          git push --force origin nightly
      - name: Start the release workflow on it
        if: steps.tag.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref nightly
